<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Слой — биржа, где навыки проверены, а не заявлены</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Слой — design tokens
   ============================================================ */
:root{
  --bg:            #f4f2ee;
  --bg-2:          #edeae4;
  --surface:       #ffffff;
  --surface-2:     #faf9f7;
  --ink:           #17171a;
  --ink-2:         #56575d;
  --ink-3:         #8e8f95;
  --ink-4:         #b6b5b1;
  --line:          #e4e1db;
  --line-2:        #d5d1c9;
  --accent:        #1e4d3a;
  --accent-2:      #2a6a4f;
  --accent-soft:   #e6efe9;
  --accent-line:   #c3d8cb;
  --warn:          #b8451f;
  --warn-soft:     #fbeee8;
  --amber:         #8a6516;
  --amber-soft:    #f7f0dd;
  --radius-sm:     6px;
  --radius:        10px;
  --radius-lg:     16px;
  --radius-xl:     22px;
  --shadow-sm:     0 1px 2px rgba(23,23,26,.05);
  --shadow:        0 1px 3px rgba(23,23,26,.06), 0 8px 24px -12px rgba(23,23,26,.10);
  --shadow-lg:     0 2px 6px rgba(23,23,26,.05), 0 24px 60px -24px rgba(23,23,26,.18);
  --font-sans:     'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-serif:    'Instrument Serif', Georgia, 'Times New Roman', serif;
  --font-mono:     'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html{ scroll-behavior:smooth; }

body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-feature-settings:'cv11','ss01';
  min-height:100vh;
}

::selection{ background:var(--accent); color:#fff; }

button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input, textarea, select{ font-family:inherit; font-size:inherit; color:inherit; }
a{ color:inherit; text-decoration:none; }

/* ============================================================
   Layout primitives
   ============================================================ */
.wrap{ max-width:1180px; margin:0 auto; padding:0 32px; }
.wrap-narrow{ max-width:820px; margin:0 auto; padding:0 32px; }

.row{ display:flex; align-items:center; }
.row-between{ display:flex; align-items:center; justify-content:space-between; }
.col{ display:flex; flex-direction:column; }
.gap-4{ gap:4px; } .gap-6{ gap:6px; } .gap-8{ gap:8px; }
.gap-12{ gap:12px; } .gap-16{ gap:16px; } .gap-24{ gap:24px; }
.gap-32{ gap:32px; } .gap-48{ gap:48px; }

/* ============================================================
   Typography
   ============================================================ */
.display{
  font-family:var(--font-serif);
  font-weight:400;
  letter-spacing:-0.02em;
  line-height:1.02;
}
h1.display{ font-size:clamp(44px, 6.4vw, 78px); }
h2.display{ font-size:clamp(32px, 4vw, 48px); }
h3.display{ font-size:clamp(24px, 2.4vw, 30px); }

.eyebrow{
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--ink-3);
  font-weight:600;
}

.lede{
  font-size:17px;
  line-height:1.55;
  color:var(--ink-2);
  max-width:56ch;
}

.muted{ color:var(--ink-2); }
.muted-2{ color:var(--ink-3); }
.mono{ font-family:var(--font-mono); font-size:12px; letter-spacing:-0.02em; }

/* ============================================================
   Buttons
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  gap:8px;
  height:42px; padding:0 20px;
  border-radius:var(--radius);
  font-size:14px; font-weight:500;
  transition:all .16s ease;
  white-space:nowrap;
  border:1px solid transparent;
}
.btn:active{ transform:translateY(1px); }

.btn-primary{ background:var(--ink); color:#fff; }
.btn-primary:hover{ background:#000; }

.btn-accent{ background:var(--accent); color:#fff; }
.btn-accent:hover{ background:var(--accent-2); }

.btn-ghost{ border-color:var(--line-2); background:var(--surface); color:var(--ink); }
.btn-ghost:hover{ border-color:var(--ink-4); background:var(--surface-2); }

.btn-quiet{ color:var(--ink-2); height:38px; padding:0 12px; }
.btn-quiet:hover{ color:var(--ink); background:rgba(0,0,0,.04); }

.btn-lg{ height:50px; padding:0 26px; font-size:15px; border-radius:12px; }
.btn-sm{ height:34px; padding:0 14px; font-size:13px; }
.btn-block{ width:100%; }

.btn[disabled]{ opacity:.45; cursor:not-allowed; }

/* ============================================================
   Nav
   ============================================================ */
.nav{
  position:sticky; top:0; z-index:50;
  background:rgba(244,242,238,.82);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;
  transition:border-color .2s ease;
}
.nav.scrolled{ border-bottom-color:var(--line); }
.nav-inner{
  display:flex; align-items:center; justify-content:space-between;
  height:64px;
}
.logo{
  display:flex; align-items:baseline; gap:1px;
  font-family:var(--font-serif); font-size:24px; letter-spacing:-0.02em;
}
.logo .dot{ color:var(--accent); }
.nav-links{ display:flex; gap:4px; }
.nav-links a{
  padding:8px 12px; border-radius:8px;
  font-size:14px; color:var(--ink-2);
  transition:all .14s ease;
}
.nav-links a:hover{ color:var(--ink); background:rgba(0,0,0,.04); }

/* ============================================================
   Hero
   ============================================================ */
.hero{ padding:80px 0 100px; position:relative; overflow:hidden; }
.hero-grid{
  display:grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap:72px;
  align-items:center;
}
.hero h1{ margin-bottom:22px; }
.hero h1 em{ font-style:italic; color:var(--accent); }
.hero .lede{ margin-bottom:32px; }
.hero-cta{ display:flex; gap:12px; flex-wrap:wrap; }

.hero-meta{
  margin-top:44px; padding-top:24px;
  border-top:1px solid var(--line);
  display:flex; gap:40px;
}
.hero-stat .n{
  font-family:var(--font-serif); font-size:30px; line-height:1;
  margin-bottom:4px;
}
.hero-stat .l{ font-size:12.5px; color:var(--ink-3); }

/* Candidate card mock */
.cand-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-xl);
  box-shadow:var(--shadow-lg);
  overflow:hidden;
  position:relative;
}
.cand-head{
  padding:22px 24px 20px;
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:14px;
}
.avatar{
  width:46px; height:46px; border-radius:50%;
  background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center;
  font-weight:600; font-size:15px; letter-spacing:0.02em;
  flex-shrink:0;
}
.avatar.sm{ width:34px; height:34px; font-size:12.5px; }
.avatar.lg{ width:60px; height:60px; font-size:19px; }

.cand-body{ padding:20px 24px 8px; }
.score-row{ margin-bottom:18px; }
.score-top{
  display:flex; justify-content:space-between; align-items:baseline;
  margin-bottom:7px;
}
.score-top .k{ font-size:13.5px; color:var(--ink-2); }
.score-top .v{ font-family:var(--font-mono); font-size:13px; font-weight:500; }
.bar{
  height:5px; border-radius:3px; background:var(--bg-2); overflow:hidden;
}
.bar > span{
  display:block; height:100%; border-radius:3px;
  background:var(--accent);
  transition:width 1.1s cubic-bezier(.16,.84,.44,1);
}
.bar > span.warn{ background:var(--amber); }

.cand-foot{
  padding:16px 24px 22px;
  display:flex; gap:6px; flex-wrap:wrap;
}
.chip{
  display:inline-flex; align-items:center;
  height:26px; padding:0 10px;
  border-radius:7px;
  background:var(--bg-2);
  font-size:12.5px; color:var(--ink-2);
  font-weight:450;
}
.chip.accent{ background:var(--accent-soft); color:var(--accent); }
.chip.line{ background:transparent; border:1px solid var(--line-2); }

.badge{
  display:inline-flex; align-items:center; gap:5px;
  height:24px; padding:0 9px;
  border-radius:6px;
  font-size:11.5px; font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
}
.badge.junior{ background:var(--bg-2); color:var(--ink-2); }
.badge.mid{ background:var(--accent-soft); color:var(--accent); }
.badge.senior{ background:var(--amber-soft); color:var(--amber); }
.badge.live{
  background:var(--warn-soft); color:var(--warn);
}
.badge.live .dot-live{
  width:6px; height:6px; border-radius:50%; background:var(--warn);
  animation:pulse 1.6s infinite;
}
@keyframes pulse{
  0%,100%{ opacity:1; } 50%{ opacity:.35; }
}

/* floating annotation on hero card */
.annot{
  position:absolute;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:10px 14px;
  box-shadow:var(--shadow);
  font-size:12.5px;
  display:flex; align-items:center; gap:9px;
}
.annot .ico{
  width:22px; height:22px; border-radius:6px;
  background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700;
}
.annot.a1{ top:32px; right:-28px; animation:float 7s ease-in-out infinite; }
.annot.a2{ bottom:70px; left:-34px; animation:float 7s ease-in-out infinite .9s; }
@keyframes float{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-7px); }
}

/* ============================================================
   Sections
   ============================================================ */
.section{ padding:96px 0; }
.section-head{ margin-bottom:56px; max-width:660px; }
.section-head .eyebrow{ margin-bottom:16px; display:block; }
.section-head h2{ margin-bottom:18px; }

.divider{ height:1px; background:var(--line); }

/* Steps */
.steps{ display:grid; grid-template-columns:repeat(3,1fr); gap:0; }
.step{
  padding:32px 32px 32px 0;
  border-top:1px solid var(--ink);
  position:relative;
}
.step + .step{ padding-left:32px; border-left:1px solid var(--line); }
.step .n{
  font-family:var(--font-mono); font-size:12px; color:var(--ink-3);
  margin-bottom:20px; display:block;
}
.step h3{ font-size:19px; font-weight:600; margin-bottom:10px; letter-spacing:-0.01em; }
.step p{ font-size:14.5px; color:var(--ink-2); line-height:1.6; }

/* Levels */
.levels{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
.level{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:28px;
  display:flex; flex-direction:column;
  transition:all .2s ease;
}
.level:hover{ border-color:var(--line-2); box-shadow:var(--shadow); }
.level-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.level h3{ font-family:var(--font-serif); font-size:28px; margin-bottom:6px; }
.level .sub{ font-size:13.5px; color:var(--ink-3); margin-bottom:22px; }
.level-list{ list-style:none; display:flex; flex-direction:column; gap:11px; margin-bottom:26px; flex:1; }
.level-list li{
  display:flex; gap:10px; align-items:flex-start;
  font-size:13.5px; color:var(--ink-2); line-height:1.45;
}
.level-list li::before{
  content:''; width:5px; height:5px; border-radius:50%;
  background:var(--accent); margin-top:7px; flex-shrink:0;
}
.level-time{
  padding-top:18px; border-top:1px solid var(--line);
  font-size:12.5px; color:var(--ink-3);
  display:flex; justify-content:space-between;
}
.level-time b{ color:var(--ink); font-weight:600; }

/* Client section */
.split{
  display:grid; grid-template-columns:0.9fr 1.1fr;
  gap:80px; align-items:center;
}
.order-mock{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);
  overflow:hidden;
}
.order-head{
  padding:16px 20px;
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
  background:var(--surface-2);
}
.order-body{ padding:20px; }
.brief{
  font-family:var(--font-mono); font-size:12px; line-height:1.7;
  color:var(--ink-2);
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px 16px;
  margin-bottom:18px;
}
.brief .hl{ color:var(--accent); font-weight:500; }
.brief .hl-2{ color:var(--amber); font-weight:500; }

.extract{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
.extract-row{
  display:flex; justify-content:space-between; align-items:center;
  font-size:13px;
}
.extract-row .k{ color:var(--ink-3); }
.extract-row .v{ font-weight:500; }

.match{
  display:flex; align-items:center; gap:14px;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  margin-bottom:8px;
  transition:all .16s ease;
  background:var(--surface);
}
.match:hover{ border-color:var(--accent-line); background:var(--surface-2); }
.match:last-child{ margin-bottom:0; }
.match-info{ flex:1; min-width:0; }
.match-name{ font-size:14px; font-weight:500; margin-bottom:2px; }
.match-why{ font-size:12.5px; color:var(--ink-3); }
.match-score{
  font-family:var(--font-mono); font-size:13px; font-weight:500;
  color:var(--accent);
}

/* ============================================================
   Auth / Onboarding / App shell
   ============================================================ */
.screen{
  min-height:100vh;
  display:flex; flex-direction:column;
}
.screen-top{
  padding:22px 0;
  border-bottom:1px solid var(--line);
}
.screen-main{
  flex:1;
  display:flex; align-items:flex-start; justify-content:center;
  padding:56px 32px 80px;
}

.panel{
  width:100%; max-width:520px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-xl);
  box-shadow:var(--shadow-lg);
  padding:40px;
}
.panel.wide{ max-width:760px; }
.panel-head{ margin-bottom:32px; }
.panel-head h2{ font-family:var(--font-serif); font-size:32px; margin-bottom:8px; }
.panel-head p{ font-size:14.5px; color:var(--ink-2); }

.tabs{
  display:flex; gap:2px;
  background:var(--bg-2);
  padding:3px; border-radius:10px;
  margin-bottom:28px;
}
.tab{
  flex:1; height:36px; border-radius:8px;
  font-size:14px; font-weight:500; color:var(--ink-2);
  transition:all .16s ease;
}
.tab.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm); }

.field{ margin-bottom:18px; }
.field label{
  display:block; font-size:13px; font-weight:500;
  margin-bottom:7px; color:var(--ink-2);
}
.field input, .field textarea, .field select{
  width:100%;
  border:1px solid var(--line-2);
  border-radius:var(--radius);
  padding:11px 14px;
  background:var(--surface);
  font-size:14.5px;
  transition:all .16s ease;
  outline:none;
}
.field textarea{ resize:vertical; min-height:110px; line-height:1.6; }
.field input:focus, .field textarea:focus, .field select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}
.field .hint{ font-size:12.5px; color:var(--ink-3); margin-top:6px; }

.role-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
.role-card{
  border:1px solid var(--line-2);
  border-radius:var(--radius);
  padding:16px;
  text-align:left;
  transition:all .16s ease;
  background:var(--surface);
}
.role-card:hover{ border-color:var(--ink-4); }
.role-card.active{
  border-color:var(--accent);
  background:var(--accent-soft);
  box-shadow:0 0 0 1px var(--accent);
}
.role-card .t{ font-size:14px; font-weight:600; margin-bottom:3px; }
.role-card .d{ font-size:12.5px; color:var(--ink-3); line-height:1.4; }
.role-card.active .d{ color:var(--accent); }

.level-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
.level-pick{
  border:1px solid var(--line-2);
  border-radius:var(--radius);
  padding:14px 12px;
  text-align:left;
  transition:all .16s ease;
  background:var(--surface);
}
.level-pick:hover{ border-color:var(--ink-4); }
.level-pick.active{
  border-color:var(--accent);
  background:var(--accent-soft);
  box-shadow:0 0 0 1px var(--accent);
}
.level-pick .t{ font-size:13.5px; font-weight:600; margin-bottom:3px; }
.level-pick .d{ font-size:11.5px; color:var(--ink-3); line-height:1.35; }
.level-pick.active .d{ color:var(--accent); }

.switch-line{
  text-align:center; margin-top:22px;
  font-size:13.5px; color:var(--ink-3);
}
.switch-line button{ color:var(--accent); font-weight:500; }
.switch-line button:hover{ text-decoration:underline; }

/* Onboarding progress */
.prog{
  display:flex; align-items:center; gap:0;
  margin-bottom:36px;
}
.prog-item{ display:flex; align-items:center; gap:10px; }
.prog-num{
  width:24px; height:24px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:11.5px; font-weight:600;
  border:1px solid var(--line-2);
  color:var(--ink-3);
  background:var(--surface);
  flex-shrink:0;
  transition:all .2s ease;
}
.prog-item.done .prog-num{ background:var(--accent); border-color:var(--accent); color:#fff; }
.prog-item.active .prog-num{ border-color:var(--accent); color:var(--accent); }
.prog-label{ font-size:13px; color:var(--ink-3); white-space:nowrap; }
.prog-item.active .prog-label{ color:var(--ink); font-weight:500; }
.prog-item.done .prog-label{ color:var(--ink-2); }
.prog-sep{ flex:1; height:1px; background:var(--line); margin:0 14px; min-width:20px; }

/* ============================================================
   Analysis / processing
   ============================================================ */
.analysis-list{ display:flex; flex-direction:column; gap:2px; }
.analysis-item{
  display:flex; align-items:center; gap:14px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
  opacity:0.35;
  transition:opacity .35s ease;
}
.analysis-item:last-child{ border-bottom:none; }
.analysis-item.on{ opacity:1; }
.analysis-item.done{ opacity:1; }
.analysis-mark{
  width:22px; height:22px; border-radius:50%;
  border:1px solid var(--line-2);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
  font-size:11px;
  transition:all .3s ease;
  color:transparent;
}
.analysis-item.on .analysis-mark{
  border-color:var(--accent);
  border-top-color:transparent;
  animation:spin .8s linear infinite;
}
.analysis-item.done .analysis-mark{
  background:var(--accent); border-color:var(--accent); color:#fff;
  animation:none;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
.analysis-text{ flex:1; }
.analysis-text .t{ font-size:14px; font-weight:500; margin-bottom:2px; }
.analysis-text .d{ font-size:12.5px; color:var(--ink-3); }
.analysis-val{
  font-family:var(--font-mono); font-size:12.5px; color:var(--ink-3);
}
.analysis-item.done .analysis-val{ color:var(--accent); }

.progress-bar{
  height:3px; background:var(--bg-2);
  border-radius:2px; overflow:hidden;
  margin-bottom:28px;
}
.progress-bar > span{
  display:block; height:100%; background:var(--accent);
  width:0%; transition:width .5s ease;
  border-radius:2px;
}

/* ============================================================
   Dashboard
   ============================================================ */
.dash{
  display:grid;
  grid-template-columns:240px 1fr;
  gap:0;
  min-height:100vh;
}
.side{
  border-right:1px solid var(--line);
  padding:24px 20px;
  background:var(--surface-2);
  position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column;
}
.side-nav{ display:flex; flex-direction:column; gap:2px; margin-top:28px; flex:1; }
.side-link{
  display:flex; align-items:center; gap:10px;
  padding:9px 12px; border-radius:8px;
  font-size:13.5px; color:var(--ink-2);
  transition:all .14s ease;
  text-align:left; width:100%;
}
.side-link:hover{ background:rgba(0,0,0,.045); color:var(--ink); }

function go(view, opts = {}){
  state.view = view;
  if(opts.sideTab) state.sideTab = opts.sideTab;
  save();
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

/* ----------------------------------------------------------------------------
   Render — корень
   ---------------------------------------------------------------------------- */
function render(){
  const app = $('#app');
  switch(state.view){
    case 'landing':    app.innerHTML = viewLanding();   break;
    case 'auth':       app.innerHTML = viewAuth();      break;
    case 'onboard':    app.innerHTML = viewOnboard();   break;
    case 'analyzing':  app.innerHTML = viewAnalyzing(); break;
    case 'dashboard':  app.innerHTML = viewDashboard(); break;
    default:           app.innerHTML = viewLanding();
  }
  bind();
  if(state.view === 'analyzing') runAnalysis();
  if(state.view === 'landing') setTimeout(animateHeroBars, 120);
}

let analysisRunning = false;
function runAnalysis(){
  if(analysisRunning) return;
  analysisRunning = true;

  const lvl = state.level || 'junior';
  const steps = ANALYSIS_STEPS[lvl];
  const items = $$('[data-an-item]');
  const bar = $('#an-bar');
  let i = 0;

  const tick = () => {
    if(i > 0){
      items[i - 1].classList.remove('on');
      items[i - 1].classList.add('done');
    }
    if(i >= items.length){
      if(bar) bar.style.width = '100%';
      setTimeout(() => {
        const res = $('#an-result');
        if(res) res.style.display = 'block';
        state.analysisDone = true;
        state.analysis = buildAnalysisResult(lvl);
        save();
        analysisRunning = false;
      }, 420);
      return;
    }
    items[i].classList.add('on');
    if(bar) bar.style.width = Math.round(((i + 1) / items.length) * 100) + '%';
    i++;
    setTimeout(tick, 900 + Math.random() * 500);
  };

  setTimeout(tick, 500);
}

function buildAnalysisResult(lvl){
  const presets = {
    junior: { github: 68, code: 72, ai: 55, arch: 51, comm: 74, computed: 'junior' },
    mid:    { github: 84, code: 81, ai: 76, arch: 73, comm: 86, computed: 'mid' },
    senior: { github: 90, code: 89, ai: 87, arch: 92, comm: 81, computed: 'senior' }
  };
  return Object.assign({}, presets[lvl] || presets.junior);
}

/* ============================================================================
   Bind — обработчики событий
   ============================================================================ */
function bind(){
  /* --- Навигация по data-go --- */
  $$('[data-go]').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      const view = el.dataset.go;
      if(view === 'auth' && el.dataset.role){
        authLocal.role = el.dataset.role;
      }
      if(view === 'dashboard' && !state.user){
        return go('auth');
      }
      go(view);
    });
  });

  /* --- Плавный скролл по анкорам --- */
  $$('[data-scroll]').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      const id = el.getAttribute('href');
      const target = $(id);
      if(target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  /* --- Полный сброс --- */
  $$('[data-reset]').forEach(el => {
    el.addEventListener('click', () => {
      resetAll();
      toast('Вы вышли из аккаунта');
    });
  });

  /* --- Nav shadow --- */
  const nav = $('#nav');
  if(nav){
    const onScroll = () => {
      if(window.scrollY > 8) nav.classList.add('scrolled');
      else nav.classList.remove('scrolled');
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  /* --- Auth --- */
  $$('[data-auth-tab]').forEach(el => {
    el.addEventListener('click', () => {
      authLocal.tab = el.dataset.authTab;
      render();
    });
  });
  $$('[data-role-pick]').forEach(el => {
    el.addEventListener('click', () => {
      authLocal.role = el.dataset.rolePick;
      render();
    });
  });
  $$('[data-level-pick]').forEach(el => {
    el.addEventListener('click', () => {
      authLocal.level = el.dataset.levelPick;
      render();
    });
  });

  const authName = $('#auth-name');
  const authEmail = $('#auth-email');
  if(authName) authName.addEventListener('input', e => authLocal.name = e.target.value);
  if(authEmail) authEmail.addEventListener('input', e => authLocal.email = e.target.value);

  const authSubmit = $('[data-auth-submit]');
  if(authSubmit){
    authSubmit.addEventListener('click', () => {
      const name = ($('#auth-name')?.value || '').trim();
      const email = ($('#auth-email')?.value || '').trim();
      const pass = ($('#auth-pass')?.value || '').trim();

      if(!name){ toast('Укажите имя'); return; }
      if(!email || !email.includes('@')){ toast('Укажите корректную почту'); return; }
      if(authLocal.tab === 'register' && pass.length < 8){ toast('Пароль — минимум 8 символов'); return; }

      state.user = { name, email };
      state.role = authLocal.role;
      state.level = authLocal.role === 'specialist' ? authLocal.level : null;
      state.onboardingStep = 0;
      state.onboarding = { github: '', comment: '', interviewDone: false, projectDone: false };
      state.analysisDone = false;
      state.analysis = null;
      state.sideTab = authLocal.role === 'client' ? 'new' : 'overview';
      save();

      if(authLocal.role === 'client'){
        go('dashboard');
        toast('Аккаунт заказчика создан');
      }else{
        go('onboard');
        toast('Аккаунт создан · шаг 1 из ' + buildOnboardSteps(authLocal.level).length);
      }
    });
  }

  /* --- Онбординг --- */
  const onbGithub = $('#onb-github');
  if(onbGithub){
    onbGithub.addEventListener('input', e => {
      state.onboarding.github = e.target.value;
      save();
    });
  }

  const onbComment = $('#onb-comment');
  if(onbComment){
    onbComment.addEventListener('input', e => {
      state.onboarding.comment = e.target.value;
      save();
    });
  }

  $$('[data-onb-next]').forEach(el => {
    el.addEventListener('click', () => {
      const steps = buildOnboardSteps(state.level || 'junior');
      const cur = state.onboardingStep;
      const stepShort = steps[cur].short;

      if(stepShort === 'GitHub'){
        const v = ($('#onb-github')?.value || '').trim();
        if(!v || !v.includes('/')){ toast('Укажите ссылку на профиль GitHub'); return; }
        state.onboarding.github = v;
      }
      if(stepShort === 'Комментарий'){
        const v = ($('#onb-comment')?.value || '').trim();
        if(v.length < 40){ toast('Комментарий слишком короткий — минимум 40 символов'); return; }
        state.onboarding.comment = v;
      }

      state.onboardingStep = Math.min(cur + 1, steps.length - 1);
      save();
      render();
    });
  });

  $$('[data-onb-back]').forEach(el => {
    el.addEventListener('click', () => {
      state.onboardingStep = Math.max(0, state.onboardingStep - 1);
      save();
      render();
    });
  });

  /* --- Собеседование (мок) --- */
  let ivIndex = 0;
  let ivSeconds = 0;
  const ivTimer = $('#iv-timer');
  if(ivTimer){
    const max = (state.level === 'senior') ? 25 * 60 : 10 * 60;
    const pad = n => String(n).padStart(2, '0');
    const int = setInterval(() => {
      if(!document.body.contains(ivTimer)){ clearInterval(int); return; }
      ivSeconds++;
      ivTimer.textContent = `${pad(Math.floor(ivSeconds/60))}:${pad(ivSeconds%60)} / ${pad(Math.floor(max/60))}:00`;
    }, 1000);
  }

  const ivNext = $('#iv-next');
  if(ivNext){
    ivNext.addEventListener('click', () => {
      const ta = $('#onb-answer');
      const answer = (ta?.value || '').trim();
      if(answer.length < 5){ toast('Напишите хотя бы короткий ответ'); return; }

      const caps = $('#iv-captions');
      if(caps){
        const you = document.createElement('div');
        you.className = 'caption you';
        you.innerHTML = `<div class="who">Вы</div><div class="txt">${escapeHtml(answer)}</div>`;
        caps.appendChild(you);
        caps.scrollTop = caps.scrollHeight;
      }

      ivIndex++;
      if(ivIndex < INTERVIEW_QUESTIONS.length){
        setTimeout(() => {
          const caps2 = $('#iv-captions');
          if(caps2){
            const ai = document.createElement('div');
            ai.className = 'caption ai';
            ai.innerHTML = `<div class="who">ИИ</div><div class="txt">${escapeHtml(INTERVIEW_QUESTIONS[ivIndex].q)}</div>`;
            caps2.appendChild(ai);
            caps2.scrollTop = caps2.scrollHeight;
          }
          if(ta) ta.value = '';
        }, 700);
      }else{
        state.onboarding.interviewDone = true;
        save();
        toast('Собеседование пройдено');
        setTimeout(() => {
          const steps = buildOnboardSteps(state.level || 'junior');
          state.onboardingStep = Math.min(state.onboardingStep + 1, steps.length - 1);
          save();
          render();
        }, 800);
      }
    });
  }

  const ivSkip = $('#iv-skip');
  if(ivSkip){
    ivSkip.addEventListener('click', () => {
      toast('Пропуск вопроса отмечен в отчёте');
    });
  }

  /* --- Завершение онбординга --- */
  $$('[data-onb-finish]').forEach(el => {
    el.addEventListener('click', () => {
      go('analyzing');
    });
  });

  /* --- Dashboard: смена вкладок --- */
  $$('[data-side]').forEach(el => {
    el.addEventListener('click', () => {
      state.sideTab = el.dataset.side;
      save();
      render();
    });
  });
  $$('[data-side-client]').forEach(el => {
    el.addEventListener('click', () => {
      state.sideTab = el.dataset.sideClient;
      save();
      render();
    });
  });

  /* --- Заказчик: отправка афиши --- */
  const orSubmit = $('#or-submit');
  if(orSubmit){
    orSubmit.addEventListener('click', () => {
      const title = ($('#or-title')?.value || '').trim();
      const brief = ($('#or-brief')?.value || '').trim();
      const budget = ($('#or-budget')?.value || '').trim();

      if(!title){ toast('Укажите название заказа'); return; }
      if(brief.length < 40){ toast('Описание слишком короткое'); return; }

      orSubmit.disabled = true;
      orSubmit.textContent = 'Разбираем…';

      setTimeout(() => {
        const order = {
          id: 'or-' + Date.now(),
          title,
          brief,
          budget,
          stack: ['React', 'TypeScript', 'REST'],
          level: 'Middle и выше',
          ai: 'Обязательна',
          matches: MOCK_SPECIALISTS.slice(0, 3),
          status: 'Ищем исполнителя'
        };
        state.orders = state.orders && state.orders.length ? state.orders.concat([order]) : [order];
        save();
        render();
        toast('Подобрано 3 специалиста');
      }, 1400);
    });
  }
}

/* ============================================================================
   Анимация баров на лендинге
   ============================================================================ */
function animateHeroBars(){
  $$('.cand-card .bar > span').forEach(el => {
    const w = el.dataset.w;
    if(!w) return;
    el.style.width = '0%';
    requestAnimationFrame(() => {
      setTimeout(() => { el.style.width = w + '%'; }, 60);
    });
  });
}

/* ============================================================================
   Инициализация
   ============================================================================ */
(function init(){
  // Если пользователь уже вошёл — откроем кабинет
  if(state.user && state.view === 'landing'){
    state.view = 'dashboard';
  }
  render();
})();

/* Клавиатурные шорткаты для демонстрации (не мешают интерфейсу) */
document.addEventListener('keydown', e => {
  if(e.target.matches('input, textarea')) return;
  if(e.key === 'Escape' && state.view === 'auth'){
    go('landing');
  }
});
</script>
